; PlatformIO-Projekt für die Infotafel-Firmware.
; Alternativ den Ordner infotafel/ in der Arduino IDE öffnen (Board "ESP32 Dev Module").
;   cd firmware && pio run -t upload && pio device monitor

[platformio]
src_dir = infotafel

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = zinggjm/GxEPD2@^1.6.4
